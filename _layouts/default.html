<!DOCTYPE html>
<html lang="{{ site.lang }}"{% if site.enable_darkmode %} data-theme="dark"{% endif %}>

  <!-- Head -->
  <head>
  {%- if page.redirect -%}
    <meta http-equiv="refresh" content="3; url={{ site.baseurl }}/" />
  {%- endif -%}
  {% include head.html %}
  </head>

  <!-- Body -->
  <body class="layout-{{ page.layout | default: 'default' }}">
    <div class="ambient" aria-hidden="true"></div>
    <canvas class="sky" aria-hidden="true" data-sky></canvas>
    <canvas class="agent" aria-hidden="true" data-agent></canvas>
    <a class="skip-link" href="#main">Skip to content</a>

    <!-- Header -->
    {%- include header.html %}

    <!-- Content -->
    <main id="main" class="site-main">
      {{ content }}
    </main>

    <!-- Footer -->
    {%- include footer.html %}

    <!-- JavaScripts -->
    {%- if page.math %}
    {% include scripts/mathjax.html %}
    {%- endif %}
    {% include scripts/analytics.html %}
  </body>
</html>

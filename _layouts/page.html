---
layout: default
---
<!-- page.html -->
<div class="container">
  <article class="page">
    <header class="page__head">
      <h1 class="page__title">
        {%- if page.title.size <= 3 -%}{{ page.title | upcase }}{%- else -%}{{ page.title | capitalize }}{%- endif -%}
      </h1>
      {%- if page.description %}
      <p class="page__desc">{{ page.description }}</p>
      {%- endif %}
    </header>

    <div class="page__body">
      {{ content }}
    </div>
  </article>
</div>

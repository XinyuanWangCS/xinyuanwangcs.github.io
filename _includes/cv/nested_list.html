<ul class="plain-list" role="list">
  {%- for content in entry.contents %}
  <li>
    <span class="plain-list__title">{{ content.title }}</span>
    {%- if content.items %}
    <ul role="list">
      {%- for subitem in content.items %}
      <li>{{ subitem }}</li>
      {%- endfor %}
    </ul>
    {%- endif %}
  </li>
  {%- endfor %}
</ul>

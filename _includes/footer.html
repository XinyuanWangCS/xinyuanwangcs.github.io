    <footer class="site-footer">
      <div class="container">
        <div class="shelf" aria-hidden="true" data-shelf><canvas></canvas></div>
        <div class="site-footer__inner">
          <p>&copy; {{ site.time | date: '%Y' }} {{ site.first_name }} {{ site.middle_name }} {{ site.last_name }}</p>
          <p class="site-footer__note">
            {{ site.footer_text }}
            {%- if site.impressum_path %}
            <a href="{{ site.url }}{{ site.baseurl }}{{ site.impressum_path }}">Impressum</a>.
            {%- endif -%}
            {%- if site.last_updated %}
            Last updated: {{ "now" | date: '%B %d, %Y' }}.
            {%- endif %}
          </p>
        </div>
      </div>
    </footer>

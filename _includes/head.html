    <!-- Metadata, OpenGraph and Schema.org -->
    {% include metadata.html %}

    <!-- Theme bootstrap: runs before first paint so there is no flash of the wrong theme -->
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#eef2f7">
    <script>
      (function () {
        var d = document.documentElement, t;
        {%- if site.enable_darkmode %}
        try { t = localStorage.getItem("theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = "light";
        {%- else %}
        t = "light";
        {%- endif %}
        d.setAttribute("data-theme", t);
        d.classList.add("js");
        // Browser UI color; site.js keeps it in sync with --bg afterwards.
        if (t === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#05080e");
        // If site.js never runs, don't leave scroll-reveal content hidden.
        setTimeout(function () { if (!window.__siteReady) d.classList.remove("js"); }, 3000);
      })();
    </script>

    <!-- Fonts (self-hosted, see assets/fonts/OFL.txt) -->
    <link rel="preload" href="{{ '/assets/fonts/inter-latin-var.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>

    <!-- Icon -->
    {%- if site.icon contains "." %}
    <link rel="icon" href="{{ site.icon | prepend: '/assets/img/' | relative_url }}"{% if site.icon contains ".svg" %} type="image/svg+xml"{% endif %}>
    {%- elsif site.icon != blank %}
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>{{ site.icon }}</text></svg>">
    {%- endif %}
    <link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">

    <!-- Styles & scripts -->
    {%- assign build = site.time | date: "%s" %}
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ build }}">
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
    <script defer src="{{ '/assets/js/site.js' | relative_url }}?v={{ build }}"></script>
